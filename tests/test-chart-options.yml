name: Test chart options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create CSV input file
        run: |
          cat > /tmp/chart-test-data.csv << 'EOF'
          name,value
          item_a,100
          item_b,200
          item_c,150
          item_d,300
          EOF

      - id: action
        uses: .
        with:
          file: /tmp/chart-test-data.csv
          name: "Chart Options Test"
          description: "Testing chart type options"
          charts: "bar,line"
          chart: "bar:sort=asc"
          output-json: /tmp/chart-output.json
          output-html: /tmp/chart-output.html
          parser: csv

      - name: Assert JSON output file exists
        run: |
          if [ ! -f "/tmp/chart-output.json" ]; then
            echo "FAIL: expected JSON output file /tmp/chart-output.json not found"
            exit 1
          fi
          echo "PASS: JSON output file exists"

      - name: Assert HTML output file exists
        run: |
          if [ ! -f "/tmp/chart-output.html" ]; then
            echo "FAIL: expected HTML output file /tmp/chart-output.html not found"
            exit 1
          fi
          echo "PASS: HTML output file exists"

      - name: Assert HTML file is non-empty
        run: |
          SIZE=$(wc -c < /tmp/chart-output.html)
          echo "HTML file size: $SIZE bytes"
          if [ "$SIZE" -lt 100 ]; then
            echo "FAIL: HTML output file is too small ($SIZE bytes), expected meaningful content"
            exit 1
          fi
          echo "PASS: HTML output file has content"

      - name: Assert output-file-html output
        env:
          ACTUAL: ${{ steps.action.outputs.output-file-html }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "/tmp/chart-output.html" ]; then
            echo "FAIL: expected output-file-html to be '/tmp/chart-output.html', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
