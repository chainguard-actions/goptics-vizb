name: Test cmd input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          cmd: "printf 'name,score\\nalpha,10\\nbeta,20\\ngamma,30\\n'"
          name: "Cmd Test"
          output-json: /tmp/cmd-output.json
          parser: csv

      - name: Assert JSON output file exists
        run: |
          if [ ! -f "/tmp/cmd-output.json" ]; then
            echo "FAIL: expected JSON output file /tmp/cmd-output.json not found"
            exit 1
          fi
          echo "PASS: JSON output file exists"

      - name: Assert JSON output is valid JSON
        run: |
          if ! python3 -c "import json, sys; json.load(open('/tmp/cmd-output.json'))" 2>/dev/null; then
            echo "FAIL: cmd-output.json is not valid JSON"
            cat /tmp/cmd-output.json || true
            exit 1
          fi
          echo "PASS: JSON output is valid"

      - name: Assert output-file-json output
        env:
          ACTUAL: ${{ steps.action.outputs.output-file-json }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "/tmp/cmd-output.json" ]; then
            echo "FAIL: expected output-file-json to be '/tmp/cmd-output.json', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
