name: Test JSON file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create JSON input file
        run: |
          cat > /tmp/test-input.json << 'EOF'
          [
            {"name": "Alpha", "value": 100},
            {"name": "Beta", "value": 200},
            {"name": "Gamma", "value": 150}
          ]
          EOF

      - id: action
        uses: .
        with:
          file: /tmp/test-input.json
          name: "JSON Dataset"
          output-json: /tmp/json-output.json
          parser: json

      - name: Assert JSON output file exists
        run: |
          if [ ! -f "/tmp/json-output.json" ]; then
            echo "FAIL: output JSON file not found at /tmp/json-output.json"
            exit 1
          fi
          echo "PASS: JSON output file exists"

      - name: Assert JSON output is non-empty
        run: |
          SIZE=$(wc -c < /tmp/json-output.json)
          echo "JSON file size: $SIZE bytes"
          if [ "$SIZE" -eq 0 ]; then
            echo "FAIL: JSON output file is empty"
            exit 1
          fi
          echo "PASS: JSON output is non-empty"

      - name: Assert output-file-json output
        env:
          ACTUAL: ${{ steps.action.outputs.output-file-json }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "/tmp/json-output.json" ]; then
            echo "FAIL: expected output-file-json to be '/tmp/json-output.json', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
