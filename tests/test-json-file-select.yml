name: Test JSON file input with select option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install vizb binary
        id: install-vizb
        shell: bash
        run: |
          OS="linux"
          ARCH="amd64"
          TAG="v0.14.1"
          VERSION="0.14.1"
          URL="https://github.com/goptics/vizb/releases/download/${TAG}/vizb@${VERSION}-${OS}-${ARCH}.tar.gz"
          mkdir -p /tmp/vizb-install
          curl -sfL "$URL" -o /tmp/vizb-install/vizb-archive.tar.gz
          tar xzf /tmp/vizb-install/vizb-archive.tar.gz -C /tmp/vizb-install
          chmod +x /tmp/vizb-install/vizb
          echo "binary=/tmp/vizb-install/vizb" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        with:
          file: "${{ github.workspace }}/tests/fixtures/data.json"
          name: "Product Sales"
          parser: json
          select: "sales,cost"
          output-json: /tmp/vizb-json-select-output.json
          vizb-binary: ${{ steps.install-vizb.outputs.binary }}

      - name: Assert JSON output file exists
        run: |
          if [ ! -f "/tmp/vizb-json-select-output.json" ]; then
            echo "FAIL: expected JSON output file not found at /tmp/vizb-json-select-output.json"
            exit 1
          fi
          echo "PASS: JSON output file exists"

      - name: Assert JSON output is valid JSON
        run: |
          if ! python3 -c "import json, sys; json.load(open('/tmp/vizb-json-select-output.json'))" 2>&1; then
            echo "FAIL: output file is not valid JSON"
            exit 1
          fi
          echo "PASS: output file is valid JSON"

      - name: Assert output-file-json action output
        env:
          ACTUAL: ${{ steps.action.outputs.output-file-json }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "/tmp/vizb-json-select-output.json" ]; then
            echo "FAIL: expected output-file-json to be '/tmp/vizb-json-select-output.json', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
