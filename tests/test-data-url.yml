name: Test data-url HTML generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          data-url: "https://example.com/data.json"
          output-html: "/tmp/data-url-output.html"
          charts: "bar,line"

      - name: Assert HTML output file exists
        run: |
          if [ ! -f "/tmp/data-url-output.html" ]; then
            echo "FAIL: HTML output file not found at /tmp/data-url-output.html"
            exit 1
          fi
          echo "PASS: HTML output file exists"

      - name: Assert HTML file contains expected content
        run: |
          if ! grep -qi "html" /tmp/data-url-output.html; then
            echo "FAIL: HTML file does not appear to contain HTML content"
            head -5 /tmp/data-url-output.html
            exit 1
          fi
          echo "PASS: HTML file contains HTML content"

      - name: Assert output-file-html output
        env:
          ACTUAL: ${{ steps.action.outputs.output-file-html }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "/tmp/data-url-output.html" ]; then
            echo "FAIL: expected '/tmp/data-url-output.html' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
