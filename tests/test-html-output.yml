name: Test HTML output generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          cmd: "printf 'name,value\\nAlpha,100\\nBeta,200\\nGamma,150\\n'"
          name: "HTML Output Test"
          output-json: "${{ runner.temp }}/html-test.json"
          output-html: "${{ runner.temp }}/html-test.html"
          parser: csv
          charts: "bar"

      - name: Assert HTML output file exists
        run: |
          HTML_FILE="${{ runner.temp }}/html-test.html"
          echo "Checking for HTML output at: $HTML_FILE"
          if [ ! -f "$HTML_FILE" ]; then
            echo "FAIL: HTML output file not found at $HTML_FILE"
            exit 1
          fi
          echo "PASS: HTML output file exists"

      - name: Assert HTML output is non-empty and looks like HTML
        run: |
          HTML_FILE="${{ runner.temp }}/html-test.html"
          CONTENT=$(cat "$HTML_FILE")
          echo "HTML file size: $(wc -c < "$HTML_FILE") bytes"
          if [ -z "$CONTENT" ]; then
            echo "FAIL: HTML output file is empty"
            exit 1
          fi
          # Check it contains basic HTML markers
          if ! echo "$CONTENT" | grep -qi "<html"; then
            echo "FAIL: HTML output does not contain <html tag"
            exit 1
          fi
          echo "PASS: HTML output is non-empty and contains HTML"

      - name: Assert output-file-html output
        env:
          ACTUAL: ${{ steps.action.outputs.output-file-html }}
        run: |
          echo "actual output-file-html: $ACTUAL"
          EXPECTED="${{ runner.temp }}/html-test.html"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected '$EXPECTED' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: output-file-html matches expected path"

      - name: Assert JSON output also exists
        run: |
          JSON_FILE="${{ runner.temp }}/html-test.json"
          if [ ! -f "$JSON_FILE" ]; then
            echo "FAIL: JSON output file not found at $JSON_FILE"
            exit 1
          fi
          echo "PASS: JSON output also exists alongside HTML"
