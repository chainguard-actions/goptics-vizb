name: Test HTML output generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare fake vizb binary
        run: |
          mkdir -p /tmp/vizb-bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-vizb.sh" /tmp/vizb-bin/vizb
          chmod +x /tmp/vizb-bin/vizb
          echo "Fake vizb binary ready"

      - id: action
        uses: .
        with:
          vizb-binary: "/tmp/vizb-bin/vizb"
          cmd: "printf 'name,value\\nfoo,10\\nbar,20\\nbaz,30'"
          name: "HTML Test"
          output-json: "/tmp/vizb-html-test.json"
          output-html: "/tmp/vizb-html-test.html"

      - name: Assert JSON output file exists
        run: |
          JSON_PATH="/tmp/vizb-html-test.json"
          echo "Checking for JSON file at: $JSON_PATH"
          if [ ! -f "$JSON_PATH" ]; then
            echo "FAIL: JSON output file not found at $JSON_PATH"
            exit 1
          fi
          echo "PASS: JSON output file exists"

      - name: Assert HTML output file exists
        run: |
          HTML_PATH="/tmp/vizb-html-test.html"
          echo "Checking for HTML file at: $HTML_PATH"
          if [ ! -f "$HTML_PATH" ]; then
            echo "FAIL: HTML output file not found at $HTML_PATH"
            exit 1
          fi
          echo "PASS: HTML output file exists"

      - name: Assert HTML file contains HTML content
        run: |
          HTML_PATH="/tmp/vizb-html-test.html"
          if ! grep -qi "<html" "$HTML_PATH"; then
            echo "FAIL: HTML file does not appear to contain HTML"
            head -5 "$HTML_PATH"
            exit 1
          fi
          echo "PASS: HTML file contains HTML content"

      - name: Assert output-file-html action output
        env:
          ACTUAL: ${{ steps.action.outputs.output-file-html }}
        run: |
          EXPECTED="/tmp/vizb-html-test.html"
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected '$EXPECTED' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
