name: Test HTML output generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install vizb binary
        run: |
          mkdir -p /tmp/vizb-bin
          TAG="v0.14.0"
          VERSION="0.14.0"
          URL="https://github.com/goptics/vizb/releases/download/${TAG}/vizb@${VERSION}-linux-amd64.tar.gz"
          curl -sfL "$URL" -o /tmp/vizb-archive.tar.gz
          tar xzf /tmp/vizb-archive.tar.gz -C /tmp/vizb-bin
          chmod +x /tmp/vizb-bin/vizb
          echo "vizb installed: $(/tmp/vizb-bin/vizb --version 2>&1 || true)"

      - id: action
        uses: .
        with:
          file: ${{ github.workspace }}/tests/fixtures/data.csv
          name: "HTML Test"
          parser: csv
          output-json: /tmp/html-test.json
          output-html: /tmp/html-test.html
          vizb-binary: /tmp/vizb-bin/vizb

      - name: Assert JSON output file exists
        run: |
          if [ ! -f "/tmp/html-test.json" ]; then
            echo "FAIL: expected JSON output file not found at /tmp/html-test.json"
            exit 1
          fi
          echo "PASS: JSON output file exists"

      - name: Assert HTML output file exists
        run: |
          if [ ! -f "/tmp/html-test.html" ]; then
            echo "FAIL: expected HTML output file not found at /tmp/html-test.html"
            exit 1
          fi
          echo "PASS: HTML output file exists"

      - name: Assert HTML file contains HTML content
        run: |
          if ! grep -qi "<html" /tmp/html-test.html; then
            echo "FAIL: HTML file does not appear to contain HTML content"
            cat /tmp/html-test.html | head -5
            exit 1
          fi
          echo "PASS: HTML file contains HTML content"

      - name: Assert output-file-html output value
        env:
          ACTUAL: ${{ steps.action.outputs.output-file-html }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "/tmp/html-test.html" ]; then
            echo "FAIL: expected '/tmp/html-test.html', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert output-file-json output value
        env:
          ACTUAL: ${{ steps.action.outputs.output-file-json }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "/tmp/html-test.json" ]; then
            echo "FAIL: expected '/tmp/html-test.json', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
