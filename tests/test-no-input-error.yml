name: Test no input error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: "No Input Test"
          # Intentionally omitting cmd, file, merge-files, merge-dir, and data-url
          # to trigger the "No input provided" error

      - name: Assert action failed with no input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when no input was provided"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when no input was provided"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
