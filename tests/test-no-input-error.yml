name: Test no input error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          output-json: /tmp/should-not-exist.json

      - name: Assert action failed due to missing input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no input is provided, but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no input was provided"

      - name: Assert no output file was created
        run: |
          if [ -f "/tmp/should-not-exist.json" ]; then
            echo "FAIL: output file should not have been created when no input was provided"
            exit 1
          fi
          echo "PASS: no output file created as expected"
