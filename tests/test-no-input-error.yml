name: Test error when no input provided
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare fake vizb binary
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-vizb.sh" /tmp/fake-vizb
          chmod +x /tmp/fake-vizb

      - id: action
        uses: .
        continue-on-error: true
        with:
          # No cmd, file, merge-files, merge-dir, or data-url provided
          # The action should fail with an error
          output-json: /tmp/vizb-no-input.json
          vizb-binary: /tmp/fake-vizb

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no input is provided, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no input was provided"
