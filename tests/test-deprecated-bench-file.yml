name: Test deprecated bench-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # Using deprecated bench-file (file is empty, so bench-file should be honored)
          bench-file: "${{ github.workspace }}/tests/fixtures/sample.csv"
          name: "Deprecated Bench File Test"
          output-json: "${{ runner.temp }}/bench-file-output.json"
          parser: csv

      - name: Assert JSON output file exists
        run: |
          JSON_FILE="${{ runner.temp }}/bench-file-output.json"
          echo "Checking for JSON output at: $JSON_FILE"
          if [ ! -f "$JSON_FILE" ]; then
            echo "FAIL: JSON output file not found at $JSON_FILE"
            exit 1
          fi
          echo "PASS: JSON output file exists (bench-file was honored)"

      - name: Assert JSON output is valid
        run: |
          JSON_FILE="${{ runner.temp }}/bench-file-output.json"
          CONTENT=$(cat "$JSON_FILE")
          echo "JSON content: $CONTENT"
          if [ -z "$CONTENT" ]; then
            echo "FAIL: JSON output file is empty"
            exit 1
          fi
          echo "$CONTENT" | python3 -m json.tool > /dev/null 2>&1 || {
            echo "FAIL: JSON output is not valid JSON"
            exit 1
          }
          echo "PASS: JSON output is valid (deprecated bench-file works)"
