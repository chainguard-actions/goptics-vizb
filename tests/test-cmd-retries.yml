name: Test cmd with retries option
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare fake vizb binary
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-vizb.sh" /tmp/fake-vizb
          chmod +x /tmp/fake-vizb

      - id: action
        uses: .
        with:
          cmd: "printf 'name,score\\nAlice,95\\nBob,87\\nCarol,92\\n'"
          cmd-retries: "3"
          output-json: /tmp/vizb-retries-output.json
          name: "Retry Test"
          parser: csv
          vizb-binary: /tmp/fake-vizb

      - name: Assert JSON output file exists
        run: |
          if [ ! -f "/tmp/vizb-retries-output.json" ]; then
            echo "FAIL: JSON output file not found at /tmp/vizb-retries-output.json"
            exit 1
          fi
          echo "PASS: JSON output file exists"

      - name: Assert output-file-json action output
        env:
          ACTUAL: ${{ steps.action.outputs.output-file-json }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "/tmp/vizb-retries-output.json" ]; then
            echo "FAIL: expected '/tmp/vizb-retries-output.json', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: output-file-json matches"
