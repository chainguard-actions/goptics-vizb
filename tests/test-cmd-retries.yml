name: Test cmd with retries
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake vizb binary
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > /tmp/fake-vizb.sh << 'EOF'
          #!/bin/sh
          OUTPUT_FILE=""
          i=1
          while [ $i -le $# ]; do
            eval "arg=\${$i}"
            if [ "$arg" = "-o" ]; then
              j=$((i+1))
              eval "OUTPUT_FILE=\${$j}"
            fi
            i=$((i+1))
          done
          if [ -n "$OUTPUT_FILE" ]; then
            echo '{"datasets":[{"name":"Retries Test","data":[]}]}' > "$OUTPUT_FILE"
          fi
          exit 0
          EOF
          chmod +x /tmp/fake-vizb.sh

      - name: Create a command that succeeds on first try
        run: |
          cat > /tmp/test-cmd.sh << 'EOF'
          #!/bin/sh
          printf 'name,value\nalpha,100\nbeta,200\n'
          EOF
          chmod +x /tmp/test-cmd.sh

      - id: action
        uses: .
        with:
          cmd: "/tmp/test-cmd.sh"
          cmd-retries: "3"
          output-json: /tmp/retries-output.json
          name: "Retries Test"
          parser: csv
          vizb-binary: /tmp/fake-vizb.sh

      - name: Assert JSON output file was created
        run: |
          echo "Checking for JSON output file at /tmp/retries-output.json"
          if [ ! -f "/tmp/retries-output.json" ]; then
            echo "FAIL: JSON output file was not created"
            exit 1
          fi
          echo "PASS: JSON output file exists"
          cat /tmp/retries-output.json

      - name: Assert output-file-json output
        env:
          ACTUAL: ${{ steps.action.outputs.output-file-json }}
        run: |
          echo "actual output-file-json: $ACTUAL"
          if [ "$ACTUAL" != "/tmp/retries-output.json" ]; then
            echo "FAIL: expected output-file-json to be '/tmp/retries-output.json', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: output-file-json is correct"
