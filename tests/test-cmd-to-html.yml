name: Test cmd input to HTML output
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake vizb binary
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > /tmp/fake-vizb.sh << 'EOF'
          #!/bin/sh
          # Fake vizb binary that simulates vizb behavior
          # Handles both convert (input file -o output.json) and ui (json -o output.html) subcommands
          OUTPUT_FILE=""
          SUBCOMMAND=""
          i=1
          while [ $i -le $# ]; do
            eval "arg=\${$i}"
            if [ $i -eq 1 ] && [ "$arg" != "-" ] && [ "${arg#-}" = "$arg" ]; then
              SUBCOMMAND="$arg"
            fi
            if [ "$arg" = "-o" ]; then
              j=$((i+1))
              eval "OUTPUT_FILE=\${$j}"
            fi
            i=$((i+1))
          done
          if [ -n "$OUTPUT_FILE" ]; then
            case "$OUTPUT_FILE" in
              *.html)
                echo '<html><body><h1>Vizb Chart</h1></body></html>' > "$OUTPUT_FILE"
                ;;
              *)
                echo '{"datasets":[{"name":"Comparisons","data":[]}]}' > "$OUTPUT_FILE"
                ;;
            esac
          fi
          exit 0
          EOF
          chmod +x /tmp/fake-vizb.sh

      - id: action
        uses: .
        with:
          cmd: "printf 'name,value\nalpha,100\nbeta,200\n'"
          output-json: /tmp/cmd-output.json
          output-html: /tmp/cmd-output.html
          name: "CMD Test"
          parser: csv
          vizb-binary: /tmp/fake-vizb.sh

      - name: Assert JSON output file was created
        run: |
          echo "Checking for JSON output file at /tmp/cmd-output.json"
          if [ ! -f "/tmp/cmd-output.json" ]; then
            echo "FAIL: JSON output file was not created"
            exit 1
          fi
          echo "PASS: JSON output file exists"
          cat /tmp/cmd-output.json

      - name: Assert HTML output file was created
        run: |
          echo "Checking for HTML output file at /tmp/cmd-output.html"
          if [ ! -f "/tmp/cmd-output.html" ]; then
            echo "FAIL: HTML output file was not created"
            exit 1
          fi
          echo "PASS: HTML output file exists"
          cat /tmp/cmd-output.html

      - name: Assert output-file-html output
        env:
          ACTUAL: ${{ steps.action.outputs.output-file-html }}
        run: |
          echo "actual output-file-html: $ACTUAL"
          if [ "$ACTUAL" != "/tmp/cmd-output.html" ]; then
            echo "FAIL: expected output-file-html to be '/tmp/cmd-output.html', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: output-file-html is correct"

      - name: Assert output-file-json output
        env:
          ACTUAL: ${{ steps.action.outputs.output-file-json }}
        run: |
          echo "actual output-file-json: $ACTUAL"
          if [ "$ACTUAL" != "/tmp/cmd-output.json" ]; then
            echo "FAIL: expected output-file-json to be '/tmp/cmd-output.json', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: output-file-json is correct"
