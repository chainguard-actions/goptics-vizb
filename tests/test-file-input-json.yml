name: Test file input JSON
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          file: "${{ github.workspace }}/tests/fixtures/sample.json"
          name: "JSON File Test"
          output-json: "${{ runner.temp }}/json-output.json"
          parser: json

      - name: Assert JSON output file exists
        run: |
          JSON_FILE="${{ runner.temp }}/json-output.json"
          echo "Checking for JSON output at: $JSON_FILE"
          if [ ! -f "$JSON_FILE" ]; then
            echo "FAIL: JSON output file not found at $JSON_FILE"
            exit 1
          fi
          echo "PASS: JSON output file exists"

      - name: Assert JSON output is valid and non-empty
        run: |
          JSON_FILE="${{ runner.temp }}/json-output.json"
          CONTENT=$(cat "$JSON_FILE")
          echo "JSON content: $CONTENT"
          if [ -z "$CONTENT" ]; then
            echo "FAIL: JSON output file is empty"
            exit 1
          fi
          echo "$CONTENT" | python3 -m json.tool > /dev/null 2>&1 || {
            echo "FAIL: JSON output is not valid JSON"
            exit 1
          }
          echo "PASS: JSON output is valid"
