name: Test cmd CSV to JSON
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          cmd: "printf 'name,value\\nalpha,10\\nbeta,20\\ngamma,30\\n'"
          parser: csv
          name: "Test Dataset"
          charts: "bar,line"
          output-json: "/tmp/test-output.json"

      - name: Assert JSON output file exists
        run: |
          echo "Checking for JSON output at /tmp/test-output.json"
          if [ ! -f "/tmp/test-output.json" ]; then
            echo "FAIL: JSON output file not found"
            exit 1
          fi
          echo "PASS: JSON output file exists"

      - name: Assert JSON output is valid JSON
        run: |
          echo "Validating JSON content"
          if ! python3 -c "import json, sys; json.load(open('/tmp/test-output.json'))" 2>&1; then
            echo "FAIL: output is not valid JSON"
            exit 1
          fi
          echo "PASS: output is valid JSON"

      - name: Assert output-file-json action output
        env:
          ACTUAL: ${{ steps.action.outputs.output-file-json }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "/tmp/test-output.json" ]; then
            echo "FAIL: expected output-file-json to be '/tmp/test-output.json', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
