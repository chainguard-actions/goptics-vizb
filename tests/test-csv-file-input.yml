name: Test CSV file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create CSV input file
        run: |
          cat > /tmp/test-data.csv << 'EOF'
          name,value
          Alpha,100
          Beta,200
          Gamma,150
          EOF

      - id: action
        uses: .
        with:
          file: /tmp/test-data.csv
          name: "Test Dataset"
          output-json: /tmp/output.json
          parser: csv

      - name: Assert JSON output file exists
        run: |
          if [ ! -f "/tmp/output.json" ]; then
            echo "FAIL: output JSON file not found at /tmp/output.json"
            exit 1
          fi
          echo "PASS: JSON output file exists"

      - name: Assert JSON output is non-empty
        run: |
          SIZE=$(wc -c < /tmp/output.json)
          echo "JSON file size: $SIZE bytes"
          if [ "$SIZE" -eq 0 ]; then
            echo "FAIL: JSON output file is empty"
            exit 1
          fi
          echo "PASS: JSON output is non-empty"

      - name: Assert output-file-json output
        env:
          ACTUAL: ${{ steps.action.outputs.output-file-json }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "/tmp/output.json" ]; then
            echo "FAIL: expected output-file-json to be '/tmp/output.json', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
