name: Test vizb-binary input (skip download)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build a fake vizb binary for testing
        run: |
          mkdir -p "${{ runner.temp }}/fake-vizb-bin"
          cat > "${{ runner.temp }}/fake-vizb-bin/vizb" << 'SCRIPT'
          #!/bin/sh
          # Fake vizb binary that produces minimal valid JSON output
          # Parse arguments to find -o flag
          OUTPUT_FILE=""
          SUBCOMMAND=""
          PREV=""
          for arg in "$@"; do
            case "$PREV" in
              -o|--output) OUTPUT_FILE="$arg" ;;
            esac
            case "$arg" in
              merge|ui) SUBCOMMAND="$arg" ;;
            esac
            PREV="$arg"
          done

          if [ "$SUBCOMMAND" = "ui" ]; then
            if [ -n "$OUTPUT_FILE" ]; then
              echo '<html><body><h1>Vizb UI</h1></body></html>' > "$OUTPUT_FILE"
            fi
            exit 0
          fi

          if [ "$SUBCOMMAND" = "merge" ]; then
            if [ -n "$OUTPUT_FILE" ]; then
              echo '[{"name":"merged","datasets":[]}]' > "$OUTPUT_FILE"
            fi
            exit 0
          fi

          # Default: produce JSON output
          if [ -n "$OUTPUT_FILE" ]; then
            echo '[{"name":"Test","datasets":[{"label":"Alpha","values":[100]},{"label":"Beta","values":[200]}]}]' > "$OUTPUT_FILE"
          fi
          exit 0
          SCRIPT
          chmod +x "${{ runner.temp }}/fake-vizb-bin/vizb"
          echo "Fake vizb binary created at ${{ runner.temp }}/fake-vizb-bin/vizb"

      - id: action
        uses: .
        with:
          cmd: "printf 'name,value\\nAlpha,100\\nBeta,200\\n'"
          name: "Binary Input Test"
          output-json: "${{ runner.temp }}/binary-test-output.json"
          vizb-binary: "${{ runner.temp }}/fake-vizb-bin/vizb"
          parser: csv

      - name: Assert JSON output file exists
        run: |
          JSON_FILE="${{ runner.temp }}/binary-test-output.json"
          echo "Checking for JSON output at: $JSON_FILE"
          if [ ! -f "$JSON_FILE" ]; then
            echo "FAIL: JSON output file not found at $JSON_FILE"
            exit 1
          fi
          echo "PASS: JSON output file exists (fake binary was used)"

      - name: Assert JSON output is valid
        run: |
          JSON_FILE="${{ runner.temp }}/binary-test-output.json"
          CONTENT=$(cat "$JSON_FILE")
          echo "JSON content: $CONTENT"
          if [ -z "$CONTENT" ]; then
            echo "FAIL: JSON output file is empty"
            exit 1
          fi
          echo "$CONTENT" | python3 -m json.tool > /dev/null 2>&1 || {
            echo "FAIL: JSON output is not valid JSON"
            exit 1
          }
          echo "PASS: JSON output is valid (vizb-binary input works)"
