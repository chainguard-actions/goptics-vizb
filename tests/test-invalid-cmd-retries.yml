name: Test error on invalid cmd-retries
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download vizb release binary
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "unsupported arch"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/vizb-dl"
          curl -sfL "https://github.com/goptics/vizb/releases/download/v0.23.1/vizb@0.23.1-linux-${ARCH}.tar.gz" -o "$RUNNER_TEMP/vizb.tar.gz"
          tar xzf "$RUNNER_TEMP/vizb.tar.gz" -C "$RUNNER_TEMP/vizb-dl"
          echo "VIZB_BIN=$RUNNER_TEMP/vizb-dl/vizb" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          vizb-binary: ${{ env.VIZB_BIN }}
          cmd: cat tests/fixtures/go-bench.txt
          cmd-retries: "0"
          output-json: retries-invalid.json
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          [ "$OUTCOME" = "failure" ] || { echo "FAIL: expected failure"; exit 1; }
          [ ! -e retries-invalid.json ] || { echo "FAIL: output should not be created"; exit 1; }
          echo "PASS"
