name: Test basic cmd CSV input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          cmd: "printf 'name,value\\nAlpha,100\\nBeta,200\\nGamma,150\\n'"
          name: "Test Benchmark"
          output-json: "${{ runner.temp }}/output.json"
          parser: csv

      - name: Assert JSON output file exists
        run: |
          JSON_FILE="${{ runner.temp }}/output.json"
          echo "Checking for JSON output at: $JSON_FILE"
          if [ ! -f "$JSON_FILE" ]; then
            echo "FAIL: JSON output file not found at $JSON_FILE"
            exit 1
          fi
          echo "PASS: JSON output file exists"

      - name: Assert JSON output is valid and non-empty
        run: |
          JSON_FILE="${{ runner.temp }}/output.json"
          CONTENT=$(cat "$JSON_FILE")
          echo "JSON content: $CONTENT"
          if [ -z "$CONTENT" ]; then
            echo "FAIL: JSON output file is empty"
            exit 1
          fi
          # Verify it's valid JSON
          echo "$CONTENT" | python3 -m json.tool > /dev/null 2>&1 || {
            echo "FAIL: JSON output is not valid JSON"
            exit 1
          }
          echo "PASS: JSON output is valid and non-empty"

      - name: Assert output-file-json output matches input
        env:
          ACTUAL: ${{ steps.action.outputs.output-file-json }}
        run: |
          echo "actual output-file-json: $ACTUAL"
          EXPECTED="${{ runner.temp }}/output.json"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected output-file-json='$EXPECTED' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: output-file-json matches expected path"
