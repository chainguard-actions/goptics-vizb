name: Test basic cmd CSV to JSON
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare fake vizb binary
        run: |
          mkdir -p /tmp/vizb-bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-vizb.sh" /tmp/vizb-bin/vizb
          chmod +x /tmp/vizb-bin/vizb
          echo "Fake vizb binary ready"

      - id: action
        uses: .
        with:
          vizb-binary: "/tmp/vizb-bin/vizb"
          cmd: "printf 'name,value\\nfoo,10\\nbar,20\\nbaz,30'"
          name: "Test Dataset"
          description: "A simple test"
          output-json: "/tmp/vizb-test-basic.json"

      - name: Assert JSON output file exists
        run: |
          JSON_PATH="/tmp/vizb-test-basic.json"
          echo "Checking for JSON file at: $JSON_PATH"
          if [ ! -f "$JSON_PATH" ]; then
            echo "FAIL: JSON output file not found at $JSON_PATH"
            exit 1
          fi
          echo "PASS: JSON output file exists"

      - name: Assert JSON output is non-empty
        run: |
          JSON_PATH="/tmp/vizb-test-basic.json"
          SIZE=$(wc -c < "$JSON_PATH")
          echo "JSON file size: $SIZE bytes"
          if [ "$SIZE" -lt 10 ]; then
            echo "FAIL: JSON output file is too small (likely empty)"
            exit 1
          fi
          echo "PASS: JSON output is non-empty"

      - name: Assert output-file-json output matches input
        env:
          ACTUAL: ${{ steps.action.outputs.output-file-json }}
        run: |
          EXPECTED="/tmp/vizb-test-basic.json"
          echo "actual: $ACTUAL"
          echo "expected: $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected output-file-json='$EXPECTED' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
