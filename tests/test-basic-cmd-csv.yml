name: Test basic cmd CSV to JSON
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          cmd: "printf 'name,value\\nfoo,10\\nbar,20\\nbaz,30'"
          name: "Test Dataset"
          output-json: "/tmp/test-output.json"

      - name: Assert JSON output file exists
        run: |
          if [ ! -f "/tmp/test-output.json" ]; then
            echo "FAIL: expected JSON output file not found at /tmp/test-output.json"
            exit 1
          fi
          echo "PASS: JSON output file exists"

      - name: Assert JSON output is valid JSON
        run: |
          if ! python3 -c "import json,sys; json.load(open('/tmp/test-output.json'))" 2>/dev/null; then
            echo "FAIL: output is not valid JSON"
            cat /tmp/test-output.json || true
            exit 1
          fi
          echo "PASS: output is valid JSON"

      - name: Assert output-file-json output matches
        env:
          ACTUAL: ${{ steps.action.outputs.output-file-json }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "/tmp/test-output.json" ]; then
            echo "FAIL: expected '/tmp/test-output.json' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
