name: Test metadata inputs (name, description, tag)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          cmd: "printf 'name,value\\nAlpha,100\\nBeta,200\\nGamma,150\\n'"
          name: "My Custom Dataset"
          description: "A test dataset for CI"
          tag: "v1.0"
          id: "test-dataset-001"
          output-json: "${{ runner.temp }}/metadata-output.json"
          parser: csv

      - name: Assert JSON output file exists
        run: |
          JSON_FILE="${{ runner.temp }}/metadata-output.json"
          echo "Checking for JSON output at: $JSON_FILE"
          if [ ! -f "$JSON_FILE" ]; then
            echo "FAIL: JSON output file not found at $JSON_FILE"
            exit 1
          fi
          echo "PASS: JSON output file exists"

      - name: Assert JSON output contains expected metadata
        run: |
          JSON_FILE="${{ runner.temp }}/metadata-output.json"
          CONTENT=$(cat "$JSON_FILE")
          echo "JSON content: $CONTENT"
          # Verify it's valid JSON
          echo "$CONTENT" | python3 -m json.tool > /dev/null 2>&1 || {
            echo "FAIL: JSON output is not valid JSON"
            exit 1
          }
          # Check that the name appears in the output
          if ! echo "$CONTENT" | grep -q "My Custom Dataset"; then
            echo "FAIL: JSON output does not contain the custom name 'My Custom Dataset'"
            exit 1
          fi
          echo "PASS: JSON output contains expected metadata"
