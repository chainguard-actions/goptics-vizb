name: Test HTML generation from bench-file
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create benchmark input file
        run: |
          cat > /tmp/bench-html-input.txt << 'EOF'
          goos: linux
          goarch: amd64
          pkg: example
          BenchmarkSort-4   	 2000000	       500 ns/op	     128 B/op	       2 allocs/op
          BenchmarkSearch-4 	 8000000	       150 ns/op	       0 B/op	       0 allocs/op
          PASS
          EOF

      - id: action
        uses: .
        with:
          bench-file: /tmp/bench-html-input.txt
          name: "SortSearchBenchmarks"
          description: "Sorting and searching benchmarks"
          output-json: /tmp/bench-html.json
          output-html: /tmp/bench-output.html
          charts: "bar,line"

      - name: Assert HTML output file exists
        run: |
          echo "Checking for HTML output at /tmp/bench-output.html"
          if [ ! -f "/tmp/bench-output.html" ]; then
            echo "FAIL: HTML output file not found"
            exit 1
          fi
          echo "PASS: HTML output file exists"

      - name: Assert HTML output contains expected content
        run: |
          if ! grep -q "<html" /tmp/bench-output.html 2>/dev/null; then
            echo "FAIL: HTML output does not contain <html tag"
            head -5 /tmp/bench-output.html
            exit 1
          fi
          echo "PASS: HTML output contains expected content"

      - name: Assert output-file-html output
        env:
          ACTUAL: ${{ steps.action.outputs.output-file-html }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "/tmp/bench-output.html" ]; then
            echo "FAIL: expected '/tmp/bench-output.html', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert output-file-json output
        env:
          ACTUAL: ${{ steps.action.outputs.output-file-json }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "/tmp/bench-html.json" ]; then
            echo "FAIL: expected '/tmp/bench-html.json', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
