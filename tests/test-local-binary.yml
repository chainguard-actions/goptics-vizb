name: Test local vizb binary input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create CSV input file
        run: |
          cat > /tmp/local-bin-data.csv << 'EOF'
          name,throughput
          Worker1,500
          Worker2,750
          Worker3,600
          EOF

      - id: action
        uses: .
        with:
          file: /tmp/local-bin-data.csv
          name: "Local Binary Test"
          output-json: /tmp/local-bin-output.json
          parser: csv
          # No vizb-binary set — uses the released binary downloaded from GitHub

      - name: Assert JSON output file exists
        run: |
          if [ ! -f "/tmp/local-bin-output.json" ]; then
            echo "FAIL: output JSON file not found at /tmp/local-bin-output.json"
            exit 1
          fi
          echo "PASS: JSON output file exists"

      - name: Assert JSON output is valid JSON
        run: |
          if ! python3 -c "import json, sys; json.load(open('/tmp/local-bin-output.json'))" 2>/dev/null; then
            echo "FAIL: output is not valid JSON"
            cat /tmp/local-bin-output.json
            exit 1
          fi
          echo "PASS: output is valid JSON"

      - name: Assert output-file-json output
        env:
          ACTUAL: ${{ steps.action.outputs.output-file-json }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "/tmp/local-bin-output.json" ]; then
            echo "FAIL: expected output-file-json to be '/tmp/local-bin-output.json', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
