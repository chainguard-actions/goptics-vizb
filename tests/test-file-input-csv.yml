name: Test file input CSV
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          file: "${{ github.workspace }}/tests/fixtures/sample.csv"
          name: "CSV File Test"
          output-json: "${{ runner.temp }}/file-output.json"
          parser: csv

      - name: Assert JSON output file exists
        run: |
          JSON_FILE="${{ runner.temp }}/file-output.json"
          echo "Checking for JSON output at: $JSON_FILE"
          if [ ! -f "$JSON_FILE" ]; then
            echo "FAIL: JSON output file not found at $JSON_FILE"
            exit 1
          fi
          echo "PASS: JSON output file exists"

      - name: Assert JSON output is valid
        run: |
          JSON_FILE="${{ runner.temp }}/file-output.json"
          CONTENT=$(cat "$JSON_FILE")
          echo "JSON content: $CONTENT"
          if [ -z "$CONTENT" ]; then
            echo "FAIL: JSON output file is empty"
            exit 1
          fi
          echo "$CONTENT" | python3 -m json.tool > /dev/null 2>&1 || {
            echo "FAIL: JSON output is not valid JSON"
            exit 1
          }
          echo "PASS: JSON output is valid"

      - name: Assert output-file-json output
        env:
          ACTUAL: ${{ steps.action.outputs.output-file-json }}
        run: |
          echo "actual output-file-json: $ACTUAL"
          EXPECTED="${{ runner.temp }}/file-output.json"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected '$EXPECTED' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
