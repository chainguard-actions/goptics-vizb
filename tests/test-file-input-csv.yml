name: Test file input CSV to JSON
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create CSV fixture file
        run: |
          cat > /tmp/input-data.csv << 'EOF'
          name,score
          Alice,95
          Bob,87
          Charlie,72
          EOF

      - id: action
        uses: .
        with:
          file: "/tmp/input-data.csv"
          name: "Score Comparison"
          description: "Test scores for three people"
          output-json: "/tmp/file-output.json"

      - name: Assert JSON output file exists
        run: |
          if [ ! -f "/tmp/file-output.json" ]; then
            echo "FAIL: expected JSON output file not found at /tmp/file-output.json"
            exit 1
          fi
          echo "PASS: JSON output file exists"

      - name: Assert JSON output is valid JSON
        run: |
          if ! python3 -c "import json,sys; json.load(open('/tmp/file-output.json'))" 2>/dev/null; then
            echo "FAIL: output is not valid JSON"
            cat /tmp/file-output.json || true
            exit 1
          fi
          echo "PASS: output is valid JSON"

      - name: Assert output-file-json output
        env:
          ACTUAL: ${{ steps.action.outputs.output-file-json }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "/tmp/file-output.json" ]; then
            echo "FAIL: expected '/tmp/file-output.json' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
