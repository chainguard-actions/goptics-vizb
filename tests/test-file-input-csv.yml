name: Test file input CSV to JSON output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download vizb binary
        run: |
          mkdir -p /tmp/vizb-install
          TAG="v0.15.0"
          VERSION="0.15.0"
          URL="https://github.com/goptics/vizb/releases/download/${TAG}/vizb@${VERSION}-linux-amd64.tar.gz"
          curl -sfL "$URL" -o /tmp/vizb-archive.tar.gz
          tar xzf /tmp/vizb-archive.tar.gz -C /tmp/vizb-install
          chmod +x /tmp/vizb-install/vizb

      - id: action
        uses: .
        with:
          file: "${{ github.workspace }}/tests/fixtures/region-metrics.csv"
          name: "Region Metrics"
          description: "Test dataset"
          output-json: "/tmp/file-output.json"
          parser: csv
          vizb-binary: /tmp/vizb-install/vizb

      - name: Assert JSON output file exists
        run: |
          if [ ! -f "/tmp/file-output.json" ]; then
            echo "FAIL: expected JSON output file /tmp/file-output.json not found"
            exit 1
          fi
          echo "PASS: JSON output file exists"

      - name: Assert JSON output is valid JSON
        run: |
          if ! python3 -c "import json,sys; json.load(open('/tmp/file-output.json'))" 2>/dev/null; then
            echo "FAIL: file-output.json is not valid JSON"
            cat /tmp/file-output.json || true
            exit 1
          fi
          echo "PASS: file-output.json is valid JSON"

      - name: Assert output-file-json output
        env:
          ACTUAL: ${{ steps.action.outputs.output-file-json }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "/tmp/file-output.json" ]; then
            echo "FAIL: expected output-file-json to be '/tmp/file-output.json', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
