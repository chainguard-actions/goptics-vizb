name: action
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stateless:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Set up Go
        if: env.ACT != 'true'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build vizb
        if: env.ACT != 'true'
        run: go build -o ./bin/vizb .

      - name: Run action (stateless)
        uses: ./
        with:
          file: examples/go/hash.txt
          output-html: index.html
          vizb-binary: ./bin/vizb

  stateful:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Set up Go
        if: env.ACT != 'true'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build vizb
        if: env.ACT != 'true'
        run: go build -o ./bin/vizb .

      - name: Generate previous JSON
        uses: ./
        with:
          name: Hash
          file: examples/go/hash.txt
          output-json: results/prev/hash.json
          vizb-binary: ./bin/vizb

      - name: Run action (stateful)
        uses: ./
        with:
          name: HTTP Frameworks Comparisons
          group-pattern: x_n
          sort: asc
          file: examples/go/http-routing.txt
          merge-dir: results/prev
          output-html: index.html
          output-json: results/bench.json
          vizb-binary: ./bin/vizb