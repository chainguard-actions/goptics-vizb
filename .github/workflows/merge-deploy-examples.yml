name: merge-deploy-examples
on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string
        description: "Language subdirectory under examples/ (e.g. go, javascript, rust)"

jobs:
  merge-deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Downloading json artifacts
        if: env.ACT != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: json-*
          path: /tmp/jsons
          merge-multiple: true

      - name: Collect local json artifacts
        if: env.ACT == 'true'
        run: |
          mkdir -p /tmp/jsons
          cp .act/jsons/*.json /tmp/jsons/

      - name: Prepare output directory
        env:
          INPUT_LANGUAGE: ${{ inputs.language }}
        run: mkdir -p "dist/examples/${INPUT_LANGUAGE}"

      - name: Merging
        uses: ./
        with:
          merge-dir: /tmp/jsons
          output-html: dist/examples/${{ inputs.language }}/index.html
          vizb-binary: ${{ env.ACT == 'true' && './bin/vizb' || '' }}

      - name: Local preview ready
        if: env.ACT == 'true'
        env:
          INPUT_LANGUAGE: ${{ inputs.language }}
        run: echo "::notice::Local preview at dist/examples/${INPUT_LANGUAGE}/index.html"

      - name: Deploying to Github pages
        if: env.ACT != 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: website
          publish_dir: dist
          keep_files: true
