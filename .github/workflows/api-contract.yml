name: API Contract

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'shared/dataset.go'
      - 'shared/stat.go'
      - 'internal/charts/**'
      - 'docs/src/content/docs/commands/serve.mdx'
      - 'docs/astro.config.mjs'
      - 'docs/package.json'
      - 'docs/pnpm-lock.yaml'
      - '.github/workflows/api-contract.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'shared/dataset.go'
      - 'shared/stat.go'
      - 'internal/charts/**'
      - 'docs/src/content/docs/commands/serve.mdx'
      - 'docs/astro.config.mjs'
      - 'docs/package.json'
      - 'docs/pnpm-lock.yaml'
      - '.github/workflows/api-contract.yml'

permissions: {}

jobs:
  contract:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: api

      - run: pnpm lint
        working-directory: api

      - run: pnpm bundle
        working-directory: api

      - run: go test -count=1 .
        working-directory: api

  docs:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: docs

      - run: pnpm build
        working-directory: docs
