name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: trstringer/manual-approval@fa642940caf8412403569b28b2db4a1df08a83a3 # v1
        with:
          # Issue creation uses workflow permissions (issues: write). GORELEASER_TOKEN
          # is a release PAT and often lacks Issues scope — that causes 403 on POST /issues.
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: fahimfaisaal
          minimum-approvals: 1
          issue-title: 'Release Approval: ${{ github.ref_name }}'
          issue-body: |
            A new release tag `${{ github.ref_name }}` has been pushed.

            **What will happen after approval:**
            - GoReleaser builds binaries for linux/darwin/windows (amd64 + arm64)
            - Release is published to GitHub Releases
            - Multi-arch Docker images are published to Docker Hub as goptics/vizb
            - Linux, macOS, and Windows installers smoke-test the published release
            - A PR is auto-submitted to microsoft/winget-pkgs
            - Docs and live examples at https://vizb.goptics.org/examples/live/ are rebuilt and published

  cli:
    name: CLI
    needs: approve
    uses: ./.github/workflows/cli.yml

  ui:
    name: UI
    needs: approve
    uses: ./.github/workflows/ui.yml

  api-contract:
    name: API Contract
    needs: approve
    uses: ./.github/workflows/api-contract.yml

  goreleaser:
    needs: [cli, ui, api-contract]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download embedded UI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cli-embedded-ui-${{ github.sha }}
          path: pkg/template

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          # Workflow GITHUB_TOKEN has contents:write. A PAT in GORELEASER_TOKEN often
          # lacks release scope (403 on POST /releases). Releases created with the
          # default token do not re-fire `on: release` workflows, so winget runs below.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  installers:
    name: Installers
    needs: goreleaser
    uses: ./.github/workflows/installers.yml
    permissions:
      contents: read
    with:
      release_tag: ${{ github.ref_name }}

  winget:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: vedantmgoyal2009/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: goptics.vizb
          installers-regex: '\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}

  docs:
    name: Prepare Docs
    needs: goreleaser
    uses: ./.github/workflows/deploy-docs.yml
    permissions:
      contents: write

  # prepare-only (workflow_call publish defaults false); final publish-site deploys all site-* artifacts
  tabular-data-examples:
    name: "Examples: Tabular Data"
    needs: goreleaser
    uses: ./.github/workflows/tabular-data-examples.yml
    permissions:
      contents: write

  math-and-3d-examples:
    name: "Examples: Math & 3D"
    needs: goreleaser
    uses: ./.github/workflows/math-and-3d-examples.yml
    permissions:
      contents: write

  comparisons-examples:
    name: "Examples: Comparisons"
    needs: goreleaser
    uses: ./.github/workflows/comparisons-examples.yml
    permissions:
      contents: write

  github-legends:
    name: "Examples: GitHub Legends"
    needs: goreleaser
    uses: ./.github/workflows/github-legends.yml
    permissions:
      contents: write

  go-examples:
    name: "Examples: Go"
    needs: goreleaser
    uses: ./.github/workflows/go-examples.yml
    permissions:
      contents: write

  javascript-examples:
    name: "Examples: JavaScript"
    needs: goreleaser
    uses: ./.github/workflows/javascript-examples.yml
    permissions:
      contents: write

  rust-examples:
    name: "Examples: Rust"
    needs: goreleaser
    uses: ./.github/workflows/rust-examples.yml
    permissions:
      contents: write

  publish-site:
    name: Publish Site
    needs:
      - docs
      - tabular-data-examples
      - math-and-3d-examples
      - comparisons-examples
      - github-legends
      - go-examples
      - javascript-examples
      - rust-examples
    permissions:
      contents: write
    uses: ./.github/workflows/publish-site.yml
    with:
      artifact_pattern: site-*
      keep_files: false
