name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: trstringer/manual-approval@662b3ddbc7685f897992051e87e1b4b58c07dc03 # v1.9.1
        with:
          # Issue creation uses workflow permissions (issues: write). GORELEASER_TOKEN
          # is a release PAT and often lacks Issues scope — that causes 403 on POST /issues.
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: fahimfaisaal
          minimum-approvals: 1
          issue-title: 'Release Approval: ${{ github.ref_name }}'
          issue-body: |
            A new release tag `${{ github.ref_name }}` has been pushed.

            **What will happen after approval:**
            - GoReleaser builds binaries for linux/darwin/windows (amd64 + arm64)
            - Release is published to GitHub Releases
            - A PR is auto-submitted to microsoft/winget-pkgs
            - Examples at https://goptics.github.io/vizb/examples/ are auto-redeployed

  goreleaser:
    needs: approve
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          # Workflow GITHUB_TOKEN has contents:write. A PAT in GORELEASER_TOKEN often
          # lacks release scope (403 on POST /releases). Releases created with the
          # default token do not re-fire `on: release` workflows, so winget runs below.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  winget:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: vedantmgoyal2009/winget-releaser@7bd472be23763def6e16bd06cc8b1cdfab0e2fd5 # main
        with:
          identifier: goptics.vizb
          installers-regex: '\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}

  deploy-docs:
    needs: goreleaser
    uses: ./.github/workflows/deploy-docs.yml
    secrets: inherit
    permissions:
      contents: write
