name: Setup JavaScript toolchain
description: Install the shared Node version and optionally pnpm with dependency caching

inputs:
  cache-dependency-path:
    description: Path to the pnpm lockfile used for the cache key
    required: false
    default: ""

runs:
  using: composite
  steps:
    - if: inputs.cache-dependency-path != ''
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      with:
        version: 9

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 22
        cache: ${{ inputs.cache-dependency-path != '' && 'pnpm' || '' }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
